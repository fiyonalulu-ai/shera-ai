<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHERA AI | Personal Artificial Intelligence</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
        rgba(0,229,255,.16),
        transparent 35%),
        radial-gradient(circle at center,
        rgba(0,80,100,.12),
        transparent 65%);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    z-index:-1;
}

/* MAIN */

.screen{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

/* TOP */

.status{
    color:#00e5ff;
    font-size:12px;
    letter-spacing:5px;
    margin-bottom:22px;
    text-shadow:0 0 12px #00e5ff;
}

.logo{
    color:#00e5ff;
    font-size:clamp(60px,9vw,120px);
    font-weight:bold;
    letter-spacing:12px;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px #00e5ff,
        0 0 70px rgba(0,229,255,.7);
}

.subtitle{
    color:#ddd;
    font-size:clamp(11px,1.7vw,18px);
    letter-spacing:7px;
    margin-top:8px;
}

/* CORE */

.core{
    width:240px;
    height:240px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:45px 0;
}

.center{
    width:65px;
    height:65px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        white 0%,
        #00e5ff 20%,
        #008ca0 45%,
        transparent 72%
    );

    box-shadow:
        0 0 20px #00e5ff,
        0 0 50px #00e5ff,
        0 0 100px rgba(0,229,255,.7);

    animation:pulse 1.5s infinite;
}

.ring{
    position:absolute;
    border:2px solid #00e5ff;
    border-radius:50%;
    box-shadow:
        0 0 12px #00e5ff,
        inset 0 0 12px rgba(0,229,255,.4);
}

.ring1{
    width:105px;
    height:105px;
    border-left-color:transparent;
    border-right-color:transparent;
    animation:rotate 4s linear infinite;
}

.ring2{
    width:150px;
    height:150px;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:reverseRotate 6s linear infinite;
}

.ring3{
    width:195px;
    height:195px;
    border-left-color:transparent;
    border-bottom-color:transparent;
    animation:rotate 8s linear infinite;
}

.ring4{
    width:235px;
    height:235px;
    border-right-color:transparent;
    border-top-color:transparent;
    animation:reverseRotate 11s linear infinite;
}

/* BUTTON */

.enter{
    padding:17px 48px;
    color:#00e5ff;
    border:1px solid #00e5ff;
    background:rgba(0,229,255,.04);
    font-size:13px;
    letter-spacing:4px;
    cursor:pointer;

    box-shadow:
        0 0 12px rgba(0,229,255,.3);

    transition:.3s;
}

.enter:hover{
    background:#00e5ff;
    color:#000;

    box-shadow:
        0 0 20px #00e5ff,
        0 0 50px rgba(0,229,255,.6);
}

/* PASSWORD SCREEN */

#passwordScreen{
    display:none;
}

.passwordBox{
    width:min(90%,400px);
    padding:40px;

    border:1px solid rgba(0,229,255,.5);

    background:rgba(0,10,15,.85);

    box-shadow:
        0 0 30px rgba(0,229,255,.2);

    backdrop-filter:blur(15px);
}

.passwordTitle{
    color:#00e5ff;
    letter-spacing:4px;
    margin-bottom:25px;
}

.passwordInput{
    width:100%;
    padding:15px;

    background:#02090c;
    border:1px solid rgba(0,229,255,.5);

    color:#00e5ff;

    outline:none;

    text-align:center;
    letter-spacing:3px;
    font-size:16px;
}

.passwordInput:focus{
    border-color:#00e5ff;
    box-shadow:0 0 15px rgba(0,229,255,.3);
}

.unlock{
    width:100%;
    margin-top:18px;
    padding:15px;

    border:1px solid #00e5ff;
    background:rgba(0,229,255,.05);

    color:#00e5ff;
    cursor:pointer;

    letter-spacing:3px;
}

.unlock:hover{
    background:#00e5ff;
    color:#000;
}

.error{
    color:#ff3b3b;
    font-size:12px;
    margin-top:15px;
    display:none;
    letter-spacing:2px;
}

/* SHERA INSIDE */

#insideScreen{
    display:none;
}

.insideStatus{
    color:#00ffcc;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:30px;
}

.insideTitle{
    color:#00e5ff;
    font-size:35px;
    letter-spacing:8px;
    text-shadow:0 0 20px #00e5ff;
}

.insideText{
    color:#777;
    margin-top:10px;
    letter-spacing:3px;
}

/* ANIMATION */

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes reverseRotate{
    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(.85);
        opacity:.7;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}
</style>
</head>


<body>

<div class="background"></div>
<div class="grid"></div>


<!-- ========================= -->
<!-- MAIN SHERA SCREEN -->
<!-- ========================= -->

<div id="mainScreen" class="screen">

    <div class="status">
        ● SHERA SYSTEM ONLINE
    </div>

    <div class="logo">
        SHERA
    </div>

    <div class="subtitle">
        PERSONAL ARTIFICIAL INTELLIGENCE
    </div>


    <!-- AI CORE -->

    <div class="core">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
        <div class="ring ring4"></div>

        <div class="center"></div>

    </div>


    <button class="enter" onclick="openPassword()">
        ENTER SHERA
    </button>

</div>


<!-- ========================= -->
<!-- PASSWORD SCREEN -->
<!-- ========================= -->

<div id="passwordScreen" class="screen">

    <div class="passwordBox">

        <div class="passwordTitle">
            SHERA SECURITY
        </div>

        <input
            id="password"
            class="passwordInput"
            type="password"
            placeholder="ENTER PASSWORD"
            onkeydown="checkEnter(event)"
        >

        <button
            class="unlock"
            onclick="unlockShera()"
        >
            UNLOCK SHERA
        </button>

        <div id="error" class="error">
            ACCESS DENIED
        </div>

    </div>

</div>


<!-- ========================= -->
<!-- INSIDE SHERA -->
<!-- ========================= -->

<div id="insideScreen" class="screen">

    <div class="insideStatus">
        ● SHERA CORE ONLINE
    </div>

    <div class="insideTitle">
        SHERA
    </div>

    <div class="insideText">
        ARTIFICIAL INTELLIGENCE CORE
    </div>


    <!-- ROTATING CORE -->

    <div class="core">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
        <div class="ring ring4"></div>

        <div class="center"></div>

    </div>

</div>


<script>

/* =========================
   PASSWORD
========================= */

/*
   මේ password එක වෙනස් කරන්න පුළුවන්.
*/

const SHERA_PASSWORD = "SHERA2026";


function openPassword(){

    document.getElementById("mainScreen").style.display = "none";

    document.getElementById("passwordScreen").style.display = "flex";

    setTimeout(function(){

        document.getElementById("password").focus();

    },100);

}


function unlockShera(){

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if(password === SHERA_PASSWORD){

        error.style.display = "none";

        document.getElementById("passwordScreen")
            .style.display = "none";

        document.getElementById("insideScreen")
            .style.display = "flex";

    }else{

        error.style.display = "block";

        document.getElementById("password").value = "";

    }

}


function checkEnter(event){

    if(event.key === "Enter"){

        unlockShera();

    }

}

</script>

</body>
</html>
